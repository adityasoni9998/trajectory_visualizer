[project]
name = "trajectory-visualizer"
version = "0.1.0"
description = "Terminal and browser viewers for inspecting agent rollout trajectories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=5.3.0",
]

[project.scripts]
trajectory-viewer = "trajectory_visualizer.app:main"
trajectory-viewer-web = "trajectory_visualizer.web:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]
browser = [
    "playwright>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

